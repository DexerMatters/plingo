[package]
name = "plingo"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["plingo-macros", "reactive-macros"]
resolver = "3"

[dependencies]

# Miscellaneous utilities
enum-iterator = "2.3.0"
fluent-uri = "0.4.1"
smallvec = "1.15.1"
ropey = "1.6.1"
indexmap = "2.14.0"
bitvec = "1.0.1"

# For lexer
regex-syntax = "0.8.10"
regex-automata = "0.4.14"
rand = "0.10"
rand_regex = "0.19.0"

# For logging
log = "0.4.29"

# For error handling
anyhow = "1.0.102"
thiserror = "2.0.18"

# For macro development
plingo-macros = { path = "plingo-macros" }
reactive-macros = { path = "reactive-macros" }

# For locking (engine, stores, visitor buffers)
parking_lot = "0.12"
color-print = "0.3.7"

[[bench]]
name = "incremental_pipeline"
harness = false

[dev-dependencies]
serde_json = "1"
