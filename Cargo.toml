[package]
name = "plingo"
version = "0.1.0"
edition = "2024"

[dependencies]

# Miscellaneous utilities
enum-iterator = "2.3.0"
fluent-uri = "0.4.1"

# For efficient data structures
arc-swap = "1.7"
smallvec = "1.15.1"
ropey = "1.6.1"
indexmap = "2.14.0"
bitvec = "1.0.1"

# For lexer
regex-syntax = "0.8.10"
regex-automata = "0.4.14"
rand = "0.10"
rand_regex = "0.19.0"

# For logging
log = "0.4.29"
env_logger = "0.11.10"
color-print = "0.3.7"
terminal_size = "0.4.4"

# For error handling
anyhow = "1.0.102"
thiserror = "2.0.18"

# For macro development
plingo-macros = { path = "plingo-macros" }

[dependencies.tokio]
features = ["sync", "rt", "rt-multi-thread", "macros"]
version = "1.52.3"

[dependencies.tokio-util]
features = ["rt"]
version = "0.7"

[dev-dependencies]
notify = "8.2.0"
similar = "3.1.1"
parking_lot = "0.12"
